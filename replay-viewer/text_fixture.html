<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>smac-starcraft-micro — worst-case text fixture</title>
<!--
  THE WORST-CASE RENDERER FIXTURE (acceptance checklist item 15).

  Every replay CI can produce carries ZERO model text: docker_smoke.sh runs
  without an ANTHROPIC_API_KEY, so every seat falls back to the scripted
  baseline and a scripted baseline emits no `say` and no `note`. The board
  bubbles and the commander feed — the entire class of chrome that exists to
  show what a model said — are therefore untested by index.html's smoke.
  cogchemists (2026-08-24) shipped four bubbles clipped to slivers with a fully
  green board for exactly that reason.

  This page loads the REAL renderer (the same smac_replay.js wasm module and
  the same broadcast_core.js compositor index.html ships, here on the MAIN
  thread so a harness can see the canvas), plays the hostile replay written by
  tools/record_text_fixture.nim — a full-cap say on EVERY unit at once, a
  full-cap 160-rune note per seat, both lines spawned into the arena corners —
  and renders it at THREE canvas sizes.

  What it asserts, at every size:
    * every drawn bubble is wholly inside the board rect;
    * every say is still exactly `sayCap` runes and every feed note exactly
      `noteCap` runes — a fixture whose remark was quietly shortened passes
      while testing nothing;
    * the reserved band is the cap's height.

  It reads those numbers from the renderer itself, through
  `smac_text_report()` (global.shoutTextReportJson). That is deliberate: this
  board's text is RASTERIZED IN NIM and shipped as sprite pixels, so nothing
  in the pipeline ever calls canvas fillText and viewer_smoke.mjs's fillText
  hook honestly reports `canvas_text.total: 0`. Asking the renderer where it
  put each string is the same question, asked where it can be answered.

  Failure sets data-replay-error="<message>" and success sets
  data-replay-loaded="true", so tools/ci/viewer_smoke.mjs --strict-text-bounds
  drives it unchanged (ci.yml's "Worst-case renderer text fixture" step).
-->
<style>
  html, body { margin: 0; background: #14100c; color: #f2e8d8;
               font: 12px/1.5 ui-monospace, monospace; }
  #board { display: block; background: #000; image-rendering: pixelated; }
  #log { padding: 8px 10px; white-space: pre-wrap; }
  .bad { color: #e0523a; }
</style>
</head>
<body>
<canvas id="board" width="1280" height="720"></canvas>
<div id="log">loading…</div>
<script>
'use strict';
// Canvas sizes the fixture renders at: the featured-match embed floor, a
// mid-size frame and a full broadcast frame.
var SIZES = [[360, 640], [640, 360], [1280, 720]];
var FRAMES_PER_SIZE = 30;

var logEl = document.getElementById('board') && document.getElementById('log');
var lines = [];
function log(line) {
  lines.push(line);
  if (logEl) logEl.textContent = lines.join('\n');
}
function fail(message) {
  log('FAIL: ' + message);
  if (logEl) logEl.className = 'bad';
  document.documentElement.setAttribute('data-replay-error', message);
}
function runeLength(text) {
  return Array.from(String(text)).length;
}
function replayUrl() {
  var params = new URLSearchParams(window.location.search);
  var value = params.get('replay') || '';
  if (!value) return '';
  return new URL(value, window.location.href).toString();
}
</script>
<script>
// The emscripten glue keeps whatever `Module` the page already declared (the
// non-MODULARIZE build plus an onRuntimeInitialized bootstrap, exactly the
// pairing static_replay_worker.js uses — see replay-viewer/config.nims).
var Module = {
  locateFile: function (path) {
    return new URL(path, window.location.href).toString();
  },
  onAbort: function (what) {
    fail('wasm runtime aborted: ' + what);
  },
  onRuntimeInitialized: function () { boot(); }
};

var core = null;
var chromeText = '';

function readReport() {
  var length = Module._smac_text_report();
  if (!length) return null;
  var pointer = Module._smac_text_report_ptr();
  var text = new TextDecoder().decode(
    Module.HEAPU8.slice(pointer, pointer + length));
  return JSON.parse(text);
}

function checkReport(label, report) {
  if (!report) { fail(label + ': the renderer produced no text report'); return false; }
  var board = report.board || {};
  if (!report.bubbles || !report.bubbles.length) {
    fail(label + ': no speech bubble was drawn — the fixture replay carries no say');
    return false;
  }
  if (!(report.band > 0)) { fail(label + ': the reserved shout band is ' + report.band); return false; }
  for (var i = 0; i < report.bubbles.length; i++) {
    var b = report.bubbles[i];
    if (b.runes !== report.sayCap) {
      fail(label + ': bubble ' + i + ' carries ' + b.runes + ' runes, not the ' +
        'full cap of ' + report.sayCap + ' (' + JSON.stringify(b.text) + ')');
      return false;
    }
    if (b.h !== report.band) {
      fail(label + ': bubble ' + i + ' is ' + b.h + ' px tall, band is ' + report.band);
      return false;
    }
    if (!b.inside || b.x < 0 || b.y < 0 ||
        b.x + b.w > board.w || b.y + b.h > board.h) {
      fail(label + ': bubble ' + i + ' at (' + b.x + ',' + b.y + ') ' + b.w + 'x' +
        b.h + ' leaves the ' + board.w + 'x' + board.h + ' board — a string with ' +
        'nowhere to go is invisible to every other gate');
      return false;
    }
  }
  var notes = 0;
  (report.feed || []).forEach(function (record) {
    var note = '';
    try { note = JSON.parse(record).note || ''; } catch (ignored) { note = ''; }
    if (!note) return;
    notes += 1;
    if (runeLength(note) !== report.noteCap) {
      fail(label + ': a feed note is ' + runeLength(note) + ' runes, not the full ' +
        'cap of ' + report.noteCap);
    }
  });
  if (!notes) { fail(label + ': the feed carried no commander note'); return false; }
  log(label + ': ' + report.bubbles.length + ' bubbles (' + report.sayCap +
    ' runes each, band ' + report.band + 'px, all inside ' + board.w + 'x' +
    board.h + '), ' + notes + ' full-cap notes');
  return true;
}

function ingest() {
  var length = Module._smac_packet_len();
  if (!length) throw new Error('the renderer produced an empty frame');
  var pointer = Module._smac_packet_ptr();
  core.ingest(Module.HEAPU8.subarray(pointer, pointer + length));
}

function step(frames) {
  for (var i = 0; i < frames; i++) {
    if (Module._smac_frame() < 0) throw new Error('smac_frame failed');
    ingest();
  }
}

function stepToATalkingFrame(cap) {
  // Playback speed, the skip-lulls boost and the end-of-replay loop all decide
  // how much sim time a presentation frame covers, so "advance N frames" is not
  // the same as "land on a frame where everyone is talking". Step until the
  // renderer reports a full squad of live bubbles and at least one commander
  // note, which every Playing tick of the fixture recording carries.
  var report = readReport();
  for (var i = 0; i < cap; i++) {
    if (report && report.bubbles && report.bubbles.length >= 5 &&
        report.feed && report.feed.length) {
      return report;
    }
    step(1);
    report = readReport();
  }
  return report;
}

function boot() {
  var url = replayUrl();
  if (!url) { fail('no ?replay= in the URL'); return; }
  var canvas = document.getElementById('board');
  core = window.BroadcastCore.create({
    canvas: canvas,
    websocket: false,
    playoutBuffer: false,
    viewportWidth: SIZES[0][0],
    viewportHeight: SIZES[0][1],
    devicePixelRatio: 1,
    onText: function (text) { chromeText = text; }
  });
  core.start();
  fetch(url, { credentials: 'omit', mode: 'cors' }).then(function (response) {
    if (!response.ok) throw new Error('replay request returned HTTP ' + response.status);
    return response.arrayBuffer();
  }).then(function (buffer) {
    var bytes = new Uint8Array(buffer);
    if (!bytes.length) throw new Error('the replay response was empty');
    var pointer = Module._malloc(bytes.length);
    Module.HEAPU8.set(bytes, pointer);
    var loaded = Module._smac_load_replay(pointer, bytes.length);
    Module._free(pointer);
    if (loaded !== 1) {
      var errLen = Module._smac_error_len();
      var message = 'the renderer rejected the fixture replay';
      if (errLen) {
        var errPtr = Module._smac_error_ptr();
        message = new TextDecoder().decode(
          Module.HEAPU8.slice(errPtr, errPtr + errLen));
      }
      throw new Error(message);
    }
    ingest();
    var ok = true;
    for (var i = 0; i < SIZES.length && ok; i++) {
      var size = SIZES[i];
      canvas.style.width = size[0] + 'px';
      canvas.style.height = size[1] + 'px';
      core.setViewportSize(size[0], size[1], 1);
      step(FRAMES_PER_SIZE);
      ok = checkReport(size[0] + 'x' + size[1], stepToATalkingFrame(400));
    }
    if (!ok) return;
    var mismatch = Module._smac_mismatch_tick();
    if (mismatch !== -1) {
      fail('the fixture replay does not re-derive: hash mismatch at tick ' + mismatch);
      return;
    }
    log('canvas draws: ' + core.getPaceStats().draws +
      ' (the board is rasterized in Nim and blitted, so no canvas fillText ' +
      'exists to measure — the bounds above come from the renderer itself)');
    log('worst-case text fixture OK at ' + SIZES.length + ' canvas sizes');
    document.documentElement.setAttribute('data-replay-loaded', 'true');
  }).catch(function (error) {
    fail(error && error.message ? error.message : String(error));
  });
}
</script>
<!-- Same three scripts, in the same order, as static_replay_worker.js. -->
<script src="./wire_constants.js"></script>
<script src="./broadcast_core.js"></script>
<script src="./smac_replay.js"></script>
</body>
</html>
